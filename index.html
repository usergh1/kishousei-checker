<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希少度チェッカー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1ef;--card:#fff;--border:#ddd8d0;--border-hi:#7c6f5b;--text:#2c2418;--text2:#6b5e4f;--text3:#a09484;--accent:#c2713a;--accent-bg:rgba(194,113,58,.1);--accent-border:rgba(194,113,58,.4);--teal:#2a7f6f;--teal-bg:rgba(42,127,111,.08);--note-bg:#faf6f1}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif}
body{height:100%;display:flex;flex-direction:column}

.result{
  flex-shrink:0;position:sticky;top:0;z-index:10;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 16px 12px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.r-hdr h1{font-family:'DM Mono',monospace;font-size:.85rem;font-weight:500;letter-spacing:.06em;color:var(--text);margin-bottom:1px}
.r-hdr p{font-size:.52rem;color:var(--text3);letter-spacing:.06em;margin-bottom:4px}
.r-title{font-size:.58rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.r-num{font-family:'DM Mono',monospace;font-size:2.4rem;font-weight:500;color:var(--teal);line-height:1.1;min-height:1.15em;display:flex;align-items:center;justify-content:center;flex-direction:column}
.r-num.zero .num-text{display:none}
.r-num .unicorn-display{display:none;font-size:2.2rem;animation:ub .6s ease}
.r-num.zero .unicorn-display{display:block}
.r-num .zero-msg{display:none;font-size:.62rem;color:var(--accent);margin-top:2px;font-family:'Noto Sans JP',sans-serif;font-weight:400}
.r-num.zero .zero-msg{display:block}
.r-num.zero{color:var(--accent)}
@keyframes ub{0%{transform:scale(0) rotate(-20deg)}50%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.r-unit{font-size:.65rem;color:var(--text3);font-weight:300;margin-bottom:6px}
.r-sub{display:flex;gap:16px;justify-content:center}
.r-sub-item{text-align:center}
.r-sub-item .v{font-family:'DM Mono',monospace;font-size:.85rem;font-weight:500;color:var(--text)}
.r-sub-item .l{font-size:.5rem;color:var(--text3)}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.filters{max-width:600px;margin:0 auto;padding:10px 12px 100px;display:flex;flex-direction:column;gap:5px}

.r-footer{font-size:.48rem;color:var(--text3);margin-top:4px;line-height:1.2}

/* Filter rows - NO overflow hidden so expanded content is visible */
.fr{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.fr-top{display:flex;align-items:center;gap:6px}
.fr-label{font-size:.7rem;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.fr-label .ico{font-size:.82rem}
.fr-src{font-size:.44rem;color:var(--text3);margin-left:2px}
.fr-src a{color:var(--teal);text-decoration:none}
.fr-ctrl{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:flex-end;align-items:center}
.fnote{font-size:.5rem;color:var(--text3);line-height:1.3;margin-top:4px;padding:4px 6px;background:var(--note-bg);border-radius:4px}
.fnote .hi{color:var(--accent);font-weight:500}
.b{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.68rem;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);user-select:none;line-height:1.3;white-space:nowrap}
.b:hover{border-color:var(--border-hi);color:var(--text2)}
.b.on{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent);font-weight:500}
.expand-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.68rem;cursor:pointer;background:transparent;color:var(--text3);user-select:none;white-space:nowrap}
.expand-btn:hover{border-color:var(--border-hi);color:var(--text2)}
.expand-btn.has-sel{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg)}
.exp{display:none;flex-wrap:wrap;gap:4px;margin-top:6px}
.exp.open{display:flex}
.hier-group{width:100%;margin-bottom:4px}
.hier-header{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.hier-items{display:flex;flex-wrap:wrap;gap:3px;padding-left:10px}
.sb{padding:3px 8px;border:1px solid var(--border);border-radius:5px;font-size:.64rem;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);user-select:none;white-space:nowrap}
.sb:hover{border-color:var(--teal);color:var(--text2)}
.sb.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);font-weight:500}
.sb.mono{font-family:'DM Mono',monospace}
.b-all{font-size:.6rem;padding:2px 8px;border:1px dashed var(--border);border-radius:5px;cursor:pointer;color:var(--text3);user-select:none}
.b-all:hover{border-color:var(--accent);color:var(--accent)}
.b-all.on{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent)}

@media(min-width:700px){
  .result{padding:16px 24px 18px}
  .r-hdr h1{font-size:1.1rem}
  .r-hdr p{font-size:.65rem}
  .r-title{font-size:.72rem}
  .r-num{font-size:3.2rem}
  .r-num .unicorn-display{font-size:3rem}
  .r-num .zero-msg{font-size:.8rem}
  .r-unit{font-size:.82rem}
  .r-sub-item .v{font-size:1.1rem}
  .r-sub-item .l{font-size:.62rem}
  .r-footer{font-size:.58rem}
  .filters{max-width:680px;padding:16px 20px 100px;gap:7px}
  .fr{padding:9px 14px;border-radius:10px}
  .fr-label{font-size:.85rem}
  .fr-label .ico{font-size:1rem}
  .fr-src{font-size:.55rem}
  .fnote{font-size:.62rem;padding:6px 8px}
  .b{padding:6px 14px;font-size:.82rem;border-radius:7px}
  .expand-btn{padding:6px 14px;font-size:.82rem}
  .sb{padding:4px 10px;font-size:.76rem}
  .b-all{font-size:.72rem;padding:4px 10px}
  .hier-items{gap:5px;padding-left:14px}
}
</style>
</head>
<body>
<div class="result">
  <div class="r-hdr"><h1>希少度チェッカー</h1><p>希少性を数値化する</p></div>
  <div class="r-title">条件に合う人数</div>
  <div class="r-num" id="rNum"><span class="unicorn-display">🦄</span><span class="zero-msg">そんな人は存在しません</span><span class="num-text">---</span></div>
  <div class="r-unit">人（日本全体）</div>
  <div class="r-sub"><div class="r-sub-item"><div class="v" id="rPct">---</div><div class="l">全人口比</div></div><div class="r-sub-item"><div class="v" id="rOne">---</div><div class="l">何人に1人</div></div></div>
  <div class="r-footer">⚠ 独立計算のため相関により実際と異なります</div>
</div>
<div class="main"><div class="filters" id="F"></div></div>

<script>
var TOTAL=123770;
var AGE=[{l:'20〜24',p:6260},{l:'25〜29',p:6519},{l:'30〜34',p:6395},{l:'35〜39',p:6871},{l:'40〜44',p:7631},{l:'45〜49',p:8745},{l:'50〜54',p:9788},{l:'55〜59',p:8490},{l:'60〜64',p:7571}];
var EDU=[{l:'偏差値50↑',s:'大卒平均 上位50%',p:50.0},{l:'偏差値55↑',s:'日東駒専 上位30.9%',p:30.9},{l:'偏差値60↑',s:'MARCH関関同立 上位15.9%',p:15.9},{l:'偏差値65↑',s:'早慶一橋東工 上位6.7%',p:6.7},{l:'偏差値70↑',s:'東大京大 上位2.3%',p:2.3}];
var ASSET=[{l:'100万〜',s:'マス層 上位74%',cp:74},{l:'500万〜',s:'マス層 上位51%',cp:51},{l:'1000万〜',s:'マス層 上位41%',cp:41},{l:'3000万〜',s:'アッパーマス層 上位21.8%',cp:21.8},{l:'5000万〜',s:'準富裕層 上位8.8%',cp:8.8},{l:'1億〜',s:'富裕層 上位2.8%',cp:2.8},{l:'5億〜',s:'超富裕層 上位0.2%',cp:0.2}];
var AGE_ASSET={'20〜24':.05,'25〜29':.10,'30〜34':.25,'35〜39':.45,'40〜44':.70,'45〜49':.90,'50〜54':1.20,'55〜59':1.50,'60〜64':1.60};
var UM_M={'20〜24':95,'25〜29':76,'30〜34':52,'35〜39':39,'40〜44':32,'45〜49':30,'50〜54':28,'55〜59':26,'60〜64':22};
var UM_F={'20〜24':91,'25〜29':66,'30〜34':39,'35〜39':26,'40〜44':20,'45〜49':17,'50〜54':15,'55〜59':12,'60〜64':9};
var UM_AVG_M=31.9,UM_AVG_F=23.3,UM_AVG=27.5;
var SM_M=25,SM_F=7.7,SM_AVG=16;
var HT_M=[{l:'170cm↑',s:'上位55%',p:55},{l:'175cm↑',s:'上位25%',p:25},{l:'180cm↑',s:'上位7%',p:7},{l:'185cm↑',s:'上位1.5%',p:1.5}];
var HT_F=[{l:'155cm↑',s:'上位65%',p:65},{l:'160cm↑',s:'上位35%',p:35},{l:'165cm↑',s:'上位10%',p:10},{l:'170cm↑',s:'上位2%',p:2}];
var REGION=[{l:'北海道',p:4.2,sub:null},{l:'東北',p:6.8,sub:[{l:'青森',p:.9},{l:'岩手',p:.9},{l:'宮城',p:1.8},{l:'秋田',p:.7},{l:'山形',p:.8},{l:'福島',p:1.4}]},{l:'関東',p:35,sub:[{l:'東京',p:11.2},{l:'神奈川',p:7.5},{l:'埼玉',p:5.9},{l:'千葉',p:5.1},{l:'茨城',p:2.3},{l:'栃木',p:1.5},{l:'群馬',p:1.5}]},{l:'中部',p:16.8,sub:[{l:'愛知',p:6.1},{l:'新潟',p:1.7},{l:'長野',p:1.6},{l:'静岡',p:2.9},{l:'岐阜',p:1.6},{l:'富山',p:.8},{l:'石川',p:.9},{l:'福井',p:.6},{l:'山梨',p:.6}]},{l:'近畿',p:16.2,sub:[{l:'大阪',p:7.2},{l:'兵庫',p:4.4},{l:'京都',p:2.1},{l:'滋賀',p:1.1},{l:'奈良',p:1},{l:'和歌山',p:.7}]},{l:'中国',p:5.7,sub:[{l:'広島',p:2.2},{l:'岡山',p:1.5},{l:'山口',p:1},{l:'島根',p:.5},{l:'鳥取',p:.4}]},{l:'四国',p:2.9,sub:[{l:'愛媛',p:1},{l:'香川',p:.8},{l:'高知',p:.5},{l:'徳島',p:.6}]},{l:'九州沖縄',p:12.4,sub:[{l:'福岡',p:4.2},{l:'熊本',p:1.4},{l:'鹿児島',p:1.2},{l:'長崎',p:1},{l:'大分',p:.9},{l:'宮崎',p:.8},{l:'佐賀',p:.6},{l:'沖縄',p:1.2}]}];
var MBTI=[{l:'NT（合理）',k:'NT',p:18.76,t:[{t:'INTJ',p:4.12},{t:'ENTJ',p:1.54},{t:'INTP',p:7.91},{t:'ENTP',p:5.19}]},{l:'NF（意味）',k:'NF',p:41.97,t:[{t:'INFJ',p:6.16},{t:'ENFJ',p:5.59},{t:'INFP',p:16.44},{t:'ENFP',p:13.78}]},{l:'SJ（秩序）',k:'SJ',p:21.06,t:[{t:'ISTJ',p:3.57},{t:'ESTJ',p:2.94},{t:'ISFJ',p:7.17},{t:'ESFJ',p:7.38}]},{l:'SP（行動）',k:'SP',p:17.31,t:[{t:'ISTP',p:3.14},{t:'ESTP',p:2.57},{t:'ISFP',p:5.58},{t:'ESFP',p:6.02}]}];

var S={gender:null,marriage:null,smoke:null,age:[],height:null,edu:null,asset:null,regionSub:{},mbtiTypes:{}};
var animFrame=null;
function wRate(m,fb){if(!S.age.length||S.age.length===AGE.length)return fb;var tp=0,w=0;for(var i=0;i<S.age.length;i++){var a=AGE[S.age[i]];w+=m[a.l]*a.p;tp+=a.p}return w/tp}
function calc(){
  var pop=S.age.length&&S.age.length<AGE.length?0:TOTAL;
  if(S.age.length&&S.age.length<AGE.length)for(var i=0;i<S.age.length;i++)pop+=AGE[S.age[i]].p;
  var mul=1;
  if(S.gender)mul*=.5;if(S.edu)mul*=S.edu/100;if(S.height)mul*=S.height/100;
  if(S.asset){var am=S.age.length>0&&S.age.length<AGE.length?wRate(AGE_ASSET,1):1;mul*=Math.min(S.asset*am,100)/100}
  if(S.marriage){var mm=S.gender==='m'?UM_M:S.gender==='f'?UM_F:null;var mf=S.gender==='m'?UM_AVG_M:S.gender==='f'?UM_AVG_F:UM_AVG;var r=mm?wRate(mm,mf):mf;mul*=S.marriage==='unmarried'?r/100:(100-r)/100}
  if(S.smoke){var sr=S.gender==='m'?SM_M:S.gender==='f'?SM_F:SM_AVG;mul*=S.smoke==='nonsmoker'?(100-sr)/100:sr/100}
  var rk=Object.keys(S.regionSub);if(rk.length){var rp=0;for(var i=0;i<rk.length;i++)rp+=S.regionSub[rk[i]];mul*=rp/100}
  var mk=Object.keys(S.mbtiTypes);if(mk.length){var mp=0;for(var i=0;i<mk.length;i++)mp+=S.mbtiTypes[mk[i]];mul*=mp/100}
  var count=Math.round(pop*1000*mul),pct=(count/(TOTAL*1000))*100;
  var oneIn=count>0?Math.max(1,Math.round((TOTAL*1000)/count)):Infinity;
  doAnim(count,pct,oneIn);
}
function doAnim(tgt,pct,oneIn){
  var el=document.getElementById('rNum'),nt=el.querySelector('.num-text');
  if(animFrame)cancelAnimationFrame(animFrame);
  if(tgt<=0){el.classList.add('zero');nt.textContent='';document.getElementById('rPct').textContent='0%';document.getElementById('rOne').textContent='∞';return}
  el.classList.remove('zero');
  var cur=parseInt(nt.textContent.replace(/[^0-9]/g,''))||0,t0=performance.now();
  function step(now){var p=Math.min((now-t0)/700,1),e=p===1?1:1-Math.pow(2,-10*p);nt.textContent=Math.round(cur+(tgt-cur)*e).toLocaleString('ja-JP');if(p<1){animFrame=requestAnimationFrame(step)}else{nt.textContent=tgt.toLocaleString('ja-JP');var pe=document.getElementById('rPct');if(pct>=10)pe.textContent=pct.toFixed(1)+'%';else if(pct>=1)pe.textContent=pct.toFixed(2)+'%';else if(pct>=.01)pe.textContent=pct.toFixed(3)+'%';else if(pct>=.001)pe.textContent=pct.toFixed(4)+'%';else pe.textContent=pct.toExponential(1)+'%';document.getElementById('rOne').textContent=oneIn.toLocaleString('ja-JP')+'人に1人'}}
  animFrame=requestAnimationFrame(step);
}
var F=document.getElementById('F');
function row(ico,lbl,src,note){var d=document.createElement('div');d.className='fr';var t=document.createElement('div');t.className='fr-top';t.innerHTML='<div class="fr-label"><span class="ico">'+ico+'</span>'+lbl+(src?' <span class="fr-src">'+src+'</span>':'')+'</div><div class="fr-ctrl"></div>';d.appendChild(t);if(note){var n=document.createElement('div');n.className='fnote';n.innerHTML=note;d.appendChild(n)}F.appendChild(d);return{el:d,ctrl:t.querySelector('.fr-ctrl')}}
function mkb(c,t,s,fn){var b=document.createElement('div');b.className='b';b.innerHTML=t+(s?' <span style="font-size:.58rem;opacity:.7">'+s+'</span>':'');b.onclick=function(){fn(b)};c.appendChild(b);return b}
function ssel(c,btn,onS,onD){var w=btn.classList.contains('on');c.querySelectorAll('.b').forEach(function(x){x.classList.remove('on')});if(w)onD();else{btn.classList.add('on');onS()}calc()}
function mkExp(par,id){var e=document.createElement('div');e.className='exp';e.id=id;var b=document.createElement('div');b.className='expand-btn';b.textContent='選択する ▼';b.onclick=function(){e.classList.toggle('open');b.textContent=e.classList.contains('open')?'閉じる ▲':'選択する ▼'};par.ctrl.appendChild(b);par.el.appendChild(e);return{exp:e,btn:b}}

// Guide text
var guide=document.createElement('div');
guide.style.cssText='font-size:.62rem;color:var(--text3);text-align:center;padding:4px 8px;line-height:1.4';
guide.textContent='気になる条件だけ選んでください。未選択の項目はフィルタされません。';
F.appendChild(guide);

// 1. GENDER
var g=row('⚧','性別','<a href="https://www.stat.go.jp/data/jinsui/2024np/index.html" target="_blank">総務省人口推計</a>','身長・婚姻・喫煙の倍率に影響します');
mkb(g.ctrl,'男性','',function(b){ssel(g.ctrl,b,function(){S.gender='m'},function(){S.gender=null});rebuildHt()});
mkb(g.ctrl,'女性','',function(b){ssel(g.ctrl,b,function(){S.gender='f'},function(){S.gender=null});rebuildHt()});

// 2. AGE
var ag=row('📅','年齢','<a href="https://www.stat.go.jp/data/jinsui/2024np/index.html" target="_blank">総務省人口推計</a>',null);
var agE=mkExp(ag,'agE');AGE.forEach(function(a,i){var c=document.createElement('div');c.className='b';c.textContent=a.l;c.onclick=function(){c.classList.toggle('on');if(c.classList.contains('on'))S.age.push(i);else{var x=S.age.indexOf(i);if(x>=0)S.age.splice(x,1)}agE.btn.classList.toggle('has-sel',S.age.length>0);calc()};agE.exp.appendChild(c)});

// 3. HEIGHT
var ht=row('📏','身長','<a href="https://www.e-stat.go.jp/dbview?sid=0003224177" target="_blank">国民健康・栄養調査</a>',null);
var htE=mkExp(ht,'htE');
function rebuildHt(){htE.exp.innerHTML='';S.height=null;htE.btn.classList.remove('has-sel');var d=S.gender==='m'?HT_M:S.gender==='f'?HT_F:null;if(!d){htE.exp.innerHTML='<span style="font-size:.6rem;color:var(--text3)">性別を先に選択</span>';return}d.forEach(function(h){var c=document.createElement('div');c.className='b';c.innerHTML=h.l+' <span style="font-size:.58rem;opacity:.7">'+h.s+'</span>';c.onclick=function(){ssel(htE.exp,c,function(){S.height=h.p;htE.btn.classList.add('has-sel')},function(){S.height=null;htE.btn.classList.remove('has-sel')})};htE.exp.appendChild(c)})}rebuildHt();

// 4. EDU
var ed=row('🎓','偏差値','<a href="https://www.mext.go.jp/b_menu/toukei/chousa01/kihon/1267995.htm" target="_blank">正規分布+学校基本調査</a>',null);
var edE=mkExp(ed,'edE');EDU.forEach(function(e){var c=document.createElement('div');c.className='b';c.innerHTML=e.l+' <span style="font-size:.58rem;opacity:.7">'+e.s+'</span>';c.onclick=function(){ssel(edE.exp,c,function(){S.edu=e.p;edE.btn.classList.add('has-sel')},function(){S.edu=null;edE.btn.classList.remove('has-sel')})};edE.exp.appendChild(c)});

// 5. ASSET
var asN='年齢が若いほど資産保有の希少性↑ 補正: ';AGE.forEach(function(a,i){asN+=a.l+':<span class="hi">×'+AGE_ASSET[a.l]+'</span>'+(i<AGE.length-1?' / ':'')});asN+=' / 全年齢:×1.0';
var as=row('💎','資産','<a href="https://www.nri.com/jp/news/newsrelease/20250213_1.html" target="_blank">野村総研</a> / <a href="https://www.j-flec.go.jp/data/kakekin_2024/" target="_blank">家計金融行動調査</a>',asN);
var asE=mkExp(as,'asE');ASSET.forEach(function(a){var c=document.createElement('div');c.className='b';c.innerHTML=a.l+' <span style="font-size:.58rem;opacity:.7">'+a.s+'</span>';c.onclick=function(){ssel(asE.exp,c,function(){S.asset=a.cp;asE.btn.classList.add('has-sel')},function(){S.asset=null;asE.btn.classList.remove('has-sel')})};asE.exp.appendChild(c)});

// 6. MARRIAGE
var mrN='年齢帯別未婚率:<br><b>男</b> ';AGE.forEach(function(a,i){mrN+=a.l+':'+UM_M[a.l]+'%'+(i<AGE.length-1?' / ':'')});mrN+='<br><b>女</b> ';AGE.forEach(function(a,i){mrN+=a.l+':'+UM_F[a.l]+'%'+(i<AGE.length-1?' / ':'')});mrN+='<br>全年齢: 男'+UM_AVG_M+'% / 女'+UM_AVG_F+'%';
var mr=row('💍','婚姻','<a href="https://www.stat.go.jp/library/faq/faq02/faq02a05.html" target="_blank">国勢調査(2020)</a>',mrN);
mkb(mr.ctrl,'非婚','',function(b){ssel(mr.ctrl,b,function(){S.marriage='unmarried'},function(){S.marriage=null})});
mkb(mr.ctrl,'既婚','',function(b){ssel(mr.ctrl,b,function(){S.marriage='married'},function(){S.marriage=null})});

// 7. SMOKING
var smN='喫煙率: 男性<span class="hi">'+SM_M+'%</span> / 女性<span class="hi">'+SM_F+'%</span> / 全体'+SM_AVG+'%';
var sm=row('🚬','喫煙','<a href="https://www.mhlw.go.jp/content/10900000/001338334.pdf" target="_blank">国民健康・栄養調査</a>',smN);
mkb(sm.ctrl,'非喫煙','',function(b){ssel(sm.ctrl,b,function(){S.smoke='nonsmoker'},function(){S.smoke=null})});
mkb(sm.ctrl,'喫煙','',function(b){ssel(sm.ctrl,b,function(){S.smoke='smoker'},function(){S.smoke=null})});

// 8. REGION
var rg=row('📍','地域','<a href="https://www.stat.go.jp/data/jinsui/2024np/index.html" target="_blank">総務省人口推計</a>',null);
var rgE=mkExp(rg,'rgE');
REGION.forEach(function(r){
  if(!r.sub){var c=document.createElement('div');c.className='b';c.innerHTML=r.l+' <span style="font-size:.58rem;opacity:.7">'+r.p+'%</span>';c.onclick=function(){c.classList.toggle('on');if(c.classList.contains('on'))S.regionSub[r.l]=r.p;else delete S.regionSub[r.l];rgE.btn.classList.toggle('has-sel',Object.keys(S.regionSub).length>0);calc()};rgE.exp.appendChild(c);return}
  var grp=document.createElement('div');grp.className='hier-group';var hdr=document.createElement('div');hdr.className='hier-header';
  var allBtn=document.createElement('div');allBtn.className='b-all';allBtn.innerHTML=r.l+' 全選択';
  var items=document.createElement('div');items.className='hier-items';
  r.sub.forEach(function(s){var sc=document.createElement('div');sc.className='sb';sc.innerHTML=s.l+' <span style="font-size:.55rem;opacity:.7">'+s.p+'%</span>';sc.onclick=function(){sc.classList.toggle('on');if(sc.classList.contains('on'))S.regionSub[s.l]=s.p;else delete S.regionSub[s.l];allBtn.classList.toggle('on',r.sub.every(function(x){return S.regionSub[x.l]}));rgE.btn.classList.toggle('has-sel',Object.keys(S.regionSub).length>0);calc()};items.appendChild(sc)});
  allBtn.onclick=function(){var on=allBtn.classList.toggle('on');r.sub.forEach(function(s){if(on)S.regionSub[s.l]=s.p;else delete S.regionSub[s.l]});items.querySelectorAll('.sb').forEach(function(c){c.classList.toggle('on',on)});rgE.btn.classList.toggle('has-sel',Object.keys(S.regionSub).length>0);calc()};
  hdr.appendChild(allBtn);grp.appendChild(hdr);grp.appendChild(items);rgE.exp.appendChild(grp);
});

// 9. MBTI
var mb=row('🧠','MBTI','<a href="https://www.16personalities.com/country-profiles/japan" target="_blank">16Personalities</a>',null);
var mbE=mkExp(mb,'mbE');
MBTI.forEach(function(temp){
  var grp=document.createElement('div');grp.className='hier-group';var hdr=document.createElement('div');hdr.className='hier-header';
  var allBtn=document.createElement('div');allBtn.className='b-all';allBtn.innerHTML=temp.l+' 全選択 <span style="font-size:.55rem;opacity:.7">'+temp.p+'%</span>';
  var items=document.createElement('div');items.className='hier-items';
  temp.t.forEach(function(tp){var tc=document.createElement('div');tc.className='sb mono';tc.innerHTML=tp.t+' <span style="font-size:.55rem;opacity:.7">'+tp.p+'%</span>';tc.onclick=function(){tc.classList.toggle('on');if(tc.classList.contains('on'))S.mbtiTypes[tp.t]=tp.p;else delete S.mbtiTypes[tp.t];allBtn.classList.toggle('on',temp.t.every(function(x){return S.mbtiTypes[x.t]}));mbE.btn.classList.toggle('has-sel',Object.keys(S.mbtiTypes).length>0);calc()};items.appendChild(tc)});
  allBtn.onclick=function(){var on=allBtn.classList.toggle('on');temp.t.forEach(function(tp){if(on)S.mbtiTypes[tp.t]=tp.p;else delete S.mbtiTypes[tp.t]});items.querySelectorAll('.sb').forEach(function(c){c.classList.toggle('on',on)});mbE.btn.classList.toggle('has-sel',Object.keys(S.mbtiTypes).length>0);calc()};
  hdr.appendChild(allBtn);grp.appendChild(hdr);grp.appendChild(items);mbE.exp.appendChild(grp);
});

calc();
</script>
</body>
</html>
